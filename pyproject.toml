[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mednorm-vi"
version = "0.0.1"
description = "MedNorm-VI: multi-expert clinical information extraction and ICD-10/RxNorm normalization for Vietnamese clinical text (Viettel AI Race 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - competition use" }
authors = [{ name = "MedNorm-VI Team" }]
keywords = ["clinical-nlp", "ner", "entity-linking", "icd-10", "rxnorm", "vietnamese"]

# NOTE: The bootstrap intentionally depends only on the standard library plus
# a YAML reader for configs. Heavy model frameworks (torch, transformers,
# faiss, ...) are deliberately NOT added yet — see docs/architecture and the
# implementation roadmap. Add them per-layer as each layer is implemented.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
    # PyYAML ships no inline types. Declaring the stub package makes the tracked
    # `mypy` run identical everywhere, so `warn_unused_ignores` stays meaningful
    # instead of flipping on whether a local virtualenv happens to have stubs.
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mednorm_vi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501", "I001"]

[tool.mypy]
python_version = "3.10"
packages = ["mednorm_vi"]
mypy_path = "src:typings"
strict = true
warn_unused_ignores = true

# Heavy model frameworks are deliberately NOT project dependencies (see the
# `dependencies` note above): they are imported lazily, inside functions, only on
# the forward-only inference path. When one happens to be installed in a local
# virtualenv, mypy follows those imports into third-party sources whose stubs
# target a newer `python_version` than this project declares, and the check fails
# for an environment reason rather than a code reason. Skip them: their internals
# are not this repository's contract.
[[tool.mypy.overrides]]
module = ["torch.*", "torch", "numpy.*", "numpy", "transformers.*", "transformers", "py_vncorenlp", "py_vncorenlp.*", "tqdm", "tqdm.*"]
follow_imports = "skip"
ignore_missing_imports = true
