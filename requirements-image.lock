# MedNorm-VI — the pin set the OFFLINE INFERENCE IMAGE installs (Audit 0054).
#
# Why this file exists, and why `requirements.lock` alone was not enough.
#
# `requirements.lock` records the environment that produced the Audit-0052/0053/0054
# measurements, exactly as `importlib.metadata` reported it. That environment has
#
#     torch==2.13.0+cu126
#
# a CUDA 12.6 build resolved from PyTorch's own index. Audit 0053 authored the
# Dockerfile against that lock and never built it. Audit 0054 built it, and the build
# failed at the first pip step for the reason the file itself hinted at: `+cu126` is a
# local version identifier that does not exist on PyPI, so `pip install --no-deps -r
# requirements.lock` cannot resolve it without PyTorch's index, and pulling the CUDA
# build into a slim image adds roughly 2.5 GB of CUDA runtime the inference path never
# touches.
#
# So the image installs the SAME upstream version from the CPU index:
#
#     torch==2.13.0   (from https://download.pytorch.org/whl/cpu)
#
# This is a deliberate, recorded deviation, not a loosened pin:
#   * the version is identical — 2.13.0 either way, no range, no `>=`;
#   * every recorded E3 validation run in Audits 0052-0054 was a **CPU forward pass**,
#     so the CPU wheel is the variant that actually produced the measurements;
#   * the E3 checkpoint loads on CPU (`map_location="cpu"` in the adapter);
#   * a GPU image is a separate, explicitly-built variant — pass
#     `--build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126` and
#     `--build-arg TORCH_SPEC=torch==2.13.0+cu126`.
#
# Development and verification tools (pytest, ruff, mypy) are absent on purpose: the
# inference image runs inference. `requirements.lock` remains the file a verification
# image installs.
#
#     pip install --no-deps --index-url https://download.pytorch.org/whl/cpu \
#         --extra-index-url https://pypi.org/simple -r requirements-image.lock
#
# `--no-deps` is safe because the graph below is fully enumerated.

# --- core runtime -----------------------------------------------------------
PyYAML==6.0.3

