# MedNorm-VI — Medication abbreviations (v1)
# ------------------------------------------------------------------------------
# Route/frequency/dose abbreviation → expansion HINTS. These are recorded as
# evidence only; Phase 1B does NOT commit to a single final meaning.
version: 1
lexicon_version: med-abbrev-1

routes:
  po: {expansion: "by mouth / oral", lang: en}
  iv: {expansion: "intravenous", lang: en}
  im: {expansion: "intramuscular", lang: en}
  sc: {expansion: "subcutaneous", lang: en}
  sl: {expansion: "sublingual", lang: en}
  pr: {expansion: "per rectum", lang: en}

frequencies:
  qd:  {expansion: "once daily", lang: en}
  bid: {expansion: "twice daily", lang: en}
  tid: {expansion: "three times daily", lang: en}
  qid: {expansion: "four times daily", lang: en}
  qhs: {expansion: "at bedtime", lang: en}
  qam: {expansion: "every morning", lang: en}
  prn: {expansion: "as needed", lang: en}
  q6h: {expansion: "every 6 hours", lang: en}

release:
  ir: {expansion: "immediate release", lang: en}
  er: {expansion: "extended release", lang: en}
  xr: {expansion: "extended release", lang: en}
  sr: {expansion: "sustained release", lang: en}
  cr: {expansion: "controlled release", lang: en}
