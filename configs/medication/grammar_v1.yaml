# MedNorm-VI — Medication grammar (v1)
# ------------------------------------------------------------------------------
# Deterministic, high-recall medication grammar. This is a PROPOSAL source, not
# the final boundary authority (L4 decides). Scores are deterministic heuristics,
# NOT calibrated probabilities. Inventories are versioned and extensible.
#
#   MED = NAME [SALT] [RELEASE] [STRENGTH|CONCENTRATION] [DOSE_FORM]
#             [ROUTE] [FREQUENCY] [DURATION] [PRN]
version: 1
grammar_version: med-g1
lexicon_seed_file: lexicon_seed_v1.yaml
abbreviations_file: abbreviations_v1.yaml

# --- Strength / concentration patterns (regex over ORIGINAL text) ---
# Values are never rewritten; a normalized numeric may be stored separately.
strength:
  units: [mg, mcg, µg, ug, g, kg, ml, mL, l, iu, ui, u]
  # number allows decimal dot/comma; range allows - or en/em dash
  number: '\d+(?:[.,]\d+)?'
  range_sep: '[-–—]'
  percent: '\d+(?:[.,]\d+)?\s?%'
  # concentration like 5 mg/ml, 20 mg/5 mL, 0.4 mg/mL
  concentration: '\d+(?:[.,]\d+)?\s?(?:mg|mcg|g|µg|ug)\s?/\s?\d*\s?(?:ml|mL|l)'

release_forms:
  - {form: IR, lang: en}
  - {form: ER, lang: en}
  - {form: XR, lang: en}
  - {form: XL, lang: en}
  - {form: SR, lang: en}
  - {form: CR, lang: en}
  - {form: extended release, lang: en}
  - {form: sustained release, lang: en}
  - {form: controlled release, lang: en}
  - {form: delayed release, lang: en}
  - {form: phóng thích kéo dài, lang: vi}
  - {form: giải phóng chậm, lang: vi}

dose_forms:
  - {form: tablet, lang: en}
  - {form: tab, lang: en}
  - {form: capsule, lang: en}
  - {form: cap, lang: en}
  - {form: solution, lang: en}
  - {form: suspension, lang: en}
  - {form: syrup, lang: en}
  - {form: injection, lang: en}
  - {form: vial, lang: en}
  - {form: ampoule, lang: en}
  - {form: cream, lang: en}
  - {form: ointment, lang: en}
  - {form: patch, lang: en}
  - {form: inhaler, lang: en}
  - {form: drops, lang: en}
  - {form: powder, lang: en}
  - {form: viên, lang: vi}
  - {form: viên nén, lang: vi}
  - {form: nang, lang: vi}
  - {form: dung dịch, lang: vi}
  - {form: hỗn dịch, lang: vi}
  - {form: siro, lang: vi}
  - {form: ống, lang: vi}

routes:
  - {form: po, lang: en}
  - {form: oral, lang: en}
  - {form: iv, lang: en}
  - {form: intravenous, lang: en}
  - {form: im, lang: en}
  - {form: intramuscular, lang: en}
  - {form: sc, lang: en}
  - {form: subcutaneous, lang: en}
  - {form: sl, lang: en}
  - {form: sublingual, lang: en}
  - {form: pr, lang: en}
  - {form: rectal, lang: en}
  - {form: topical, lang: en}
  - {form: inhaled, lang: en}
  - {form: uống, lang: vi}
  - {form: tiêm bắp, lang: vi}
  - {form: tĩnh mạch, lang: vi}
  - {form: dưới da, lang: vi}

frequencies:
  - {form: qd, lang: en}
  - {form: bid, lang: en}
  - {form: tid, lang: en}
  - {form: qid, lang: en}
  - {form: qhs, lang: en}
  - {form: qam, lang: en}
  - {form: prn, lang: en}
  - {form: daily, lang: en}
  - {form: once daily, lang: en}
  - {form: twice daily, lang: en}
  - {form: q4h, lang: en}
  - {form: q6h, lang: en}
  - {form: q8h, lang: en}
  - {form: q12h, lang: en}
  - {form: mỗi ngày, lang: vi}
  - {form: ngày 1 lần, lang: vi}
  - {form: ngày 2 lần, lang: vi}
  - {form: sáng, lang: vi}
  - {form: chiều, lang: vi}
  - {form: tối, lang: vi}

prn_forms:
  - {form: prn, lang: en}
  - {form: as needed, lang: en}
  - {form: khi cần, lang: vi}

duration:
  - '\bx\s?\d+\s?(?:days?|weeks?|ngày|tuần)\b'
  - '\b(?:trong|for)\s?\d+\s?(?:days?|weeks?|ngày|tuần)\b'

conjunctions: [và, and, '+', ',', '/']

# --- Boundary candidate templates (progressive right-extension from NAME) ---
# Each surviving proposal references the same MedicationParse. L4 selects finals.
boundary_candidates:
  - name_only            # NAME
  - name_strength        # NAME [SALT] [RELEASE] STRENGTH
  - name_strength_form   # ... DOSE_FORM
  - name_strength_route  # ... ROUTE
  - full                 # NAME .. last recognized component

# --- Scoring weights (deterministic heuristic evidence) ---
scoring:
  name_lexicon_match: 0.45
  name_unknown_with_structure: 0.25   # unknown NAME but strong following structure
  section_prior: 0.20
  strength_present: 0.20
  route_present: 0.10
  frequency_present: 0.10
  dose_form_present: 0.10
  list_structure: 0.15
  completeness_per_component: 0.05

# Minimum evidence to emit a medication proposal for an UNKNOWN name (not in the
# seed lexicon): it must be followed by a strength or dose-form/route structure.
min_context_evidence:
  unknown_name_requires_structure: true

# --- Hard-negative patterns (never a medication just because a number/unit) ---
hard_negatives:
  # bare vitals / measurements / ages / dates handled structurally + these:
  - '\b(tuổi|years? old|age)\b'
  - '\b(huyết áp|blood pressure|mạch|pulse|nhiệt độ|temperature)\b'
  - '\b\d{1,2}[/:]\d{2}\b'          # times like 09:30 / dates 12/05
  - '\bcao\s+\d+\s?cm\b'            # height
  - '\bnặng\s+\d+\s?kg\b'           # weight
