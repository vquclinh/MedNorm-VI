# MedNorm-VI — Medication name seed lexicon (v1)
# ------------------------------------------------------------------------------
# A SMALL, deterministic seed list of representative/common ingredient names used
# for tests and bootstrapping ONLY. This is NOT an exhaustive drug inventory and
# no external drug database is downloaded. The production system loads an
# additional LOCAL, git-ignored lexicon from `production_lexicon_path` (populated
# later from permitted sources); that path is empty here.
version: 1
lexicon_version: med-lex-seed-1
provenance: representative_seed
production_lexicon_path: data/lexicons/medication_names.txt   # git-ignored; may be absent

# Ingredient names (lowercased match forms). Salts/brands are optional hints.
ingredients:
  - paracetamol
  - acetaminophen
  - amlodipine
  - metformin
  - insulin
  - aspirin
  - amoxicillin
  - ibuprofen
  - omeprazole
  - atorvastatin
  - losartan
  - metoprolol
  - furosemide
  - salbutamol
  - ceftriaxone
  - azithromycin
  - clopidogrel
  - enalapril
  - simvastatin
  - prednisolone

salts:
  - besylate
  - maleate
  - sodium
  - hydrochloride
  - hcl
  - sulfate
  - succinate

brand_hints:
  - panadol
  - augmentin
  - ventolin
