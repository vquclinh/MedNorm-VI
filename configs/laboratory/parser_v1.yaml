# MedNorm-VI — Laboratory parser (v1)
# ------------------------------------------------------------------------------
# Deterministic laboratory / test-result parser over L1 rows and cells. Emits
# TEST_NAME / TEST_RESULT proposals and an INTERNAL `has_result` relation. It
# never emits final organizer entities. Scores are deterministic heuristics.
version: 1
parser_version: lab-p1
test_lexicon_seed_file: test_lexicon_seed_v1.yaml
units_file: units_v1.yaml

# --- Result value patterns (regex over ORIGINAL text) ---
result:
  number: '\d+(?:[.,]\d+)?'
  inequality: '(?:<=|>=|<|>|≤|≥)\s?\d+(?:[.,]\d+)?'
  range: '\d+(?:[.,]\d+)?\s?[-–]\s?\d+(?:[.,]\d+)?'
  percent: '\d+(?:[.,]\d+)?\s?%'

qualitative_terms:
  - {term: positive, lang: en}
  - {term: negative, lang: en}
  - {term: reactive, lang: en}
  - {term: non-reactive, lang: en}
  - {term: detected, lang: en}
  - {term: not detected, lang: en}
  - {term: trace, lang: en}
  - {term: âm tính, lang: vi}
  - {term: dương tính, lang: vi}
  - {term: không phát hiện, lang: vi}
  - {term: có, lang: vi}
  # Normal/abnormal descriptors (Audit 0015 lab-boundary review; lexicon
  # coverage, not threshold tuning). Multi-word terms are matched verbatim.
  - {term: bình thường, lang: vi}
  - {term: tăng nhẹ, lang: vi}

reference_range:
  - '\(\s*\d+(?:[.,]\d+)?\s?[-–]\s?\d+(?:[.,]\d+)?\s*\)'
  - '\[\s*\d+(?:[.,]\d+)?\s?[-–]\s?\d+(?:[.,]\d+)?\s*\]'
  - '\b(?:ref|reference|tham chiếu)\s*:?\s*\d+(?:[.,]\d+)?\s?[-–]\s?\d+(?:[.,]\d+)?'

flags:
  - {form: H, meaning: high, lang: en}
  - {form: L, meaning: low, lang: en}
  - {form: high, meaning: high, lang: en}
  - {form: low, meaning: low, lang: en}
  - {form: "↑", meaning: high, lang: sym}
  - {form: "↓", meaning: low, lang: sym}
  - {form: cao, meaning: high, lang: vi}
  - {form: thấp, meaning: low, lang: vi}

# Where a lab proposal may originate (recorded in provenance).
sources: [key_value, table_like, semicolon_row, narrative]

# --- Narrative pattern: "<TEST> <copula> <value> <unit>" ---
# Only fires when the test name is a lexicon hit AND a numeric value+unit follows.
narrative:
  copulas: ['là', 'is', ':', '=', 'đo được', 'khoảng']
  require_lexicon_test: true
  require_value_and_unit: true

# --- Pairing (deterministic bipartite: TEST_NAME -> TEST_RESULT) ---
pairing:
  # cost = w_distance*norm_distance + w_delimiter*delim_penalty
  #        + w_order*order_penalty - w_same_cell*same_cell_bonus - w_unit*unit_bonus
  weights:
    distance: 0.4
    delimiter: 0.2
    order: 0.2
    same_row_bonus: 0.5
    unit_bonus: 0.2
  max_cost: 0.9
  # do not pair a name and result that fall in different L1 sections
  forbid_cross_section: true
  keep_close_alternatives_within: 0.05

scoring:
  test_lexicon_match: 0.45
  row_structure: 0.35
  key_value_structure: 0.40
  value_pattern: 0.30
  unit_evidence: 0.20
  reference_range_evidence: 0.15
  unknown_test_with_structure: 0.20

confidence_thresholds:
  min_test_name: 0.30
  min_test_result: 0.30
  min_narrative: 0.55

# --- Hard negatives: number+unit that must NOT be a lab result ---
hard_negatives:
  - '\b\d{1,2}[/:]\d{2}\b'              # times / dates
  - '\b(tuổi|years? old|age)\b'
  - '\b\d{9,11}\b'                      # phone-like long numbers
  # medication doses (bare mg/mcg/g) — but NOT lab concentration units like
  # "g/L" or "mg/dL" (negative lookahead on a following word char or slash).
  - '\b\d+\s?(?:mg|mcg|g)(?![\w/])'
  - '\bhuyết áp\b'                      # blood pressure unless configured as a test
