version: 1
name: organizer_active_input
# Canonical descriptor of the ACTIVE organizer test input.
# Single source of truth for which release the stable active path holds.
# Repository commands read the active path directly (it is intentionally stable);
# this file records provenance and hashes only. No raw clinical text is stored.
#
# Layout (Audit 0015): the ONLY persistent extracted dataset is the active
# input/. Historical releases are retained solely as verified ZIP archives under
# archives/<release>/ and are recoverable on demand — there is no persistent
# snapshots/ directory and no hash-named path. Payload hashes live here as
# metadata, never in filesystem paths.
#
# NOTE: deliberately NOT placed under data/manifests/ — that directory is
# auto-validated by the external-resource governance validator, which would
# misclassify input-only organizer data. Organizer input is INPUT ONLY and must
# never be used as training/label data.

active_input:
  id: turn2_vong1
  path: data/organizer_test/input                 # stable path used by all commands
  archive_path: data/organizer_test/archives/turn2_vong1/input_turn2_vong1.zip
  organizer_filename: input_turn2_vong1.zip
  payload_tree_hash: d7ace1838a3433ba40ca3a9df5a8fc3a86be5a2a7ca989c8361e2175dd58620d
  document_count: 100
  document_extension: .txt
  encoding: utf-8 (no BOM; LF newlines)
