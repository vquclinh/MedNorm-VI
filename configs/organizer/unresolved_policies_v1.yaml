# MedNorm-VI — Organizer UNRESOLVED policies (v1)
# -----------------------------------------------------------------------------
# Intentionally undisclosed or only partially disclosed organizer conventions.
# Each entry is a HYPOTHESIS SLOT, not a confirmed rule. A policy is resolved
# only by a leaderboard experiment or an explicit organizer statement — never by
# assumption. Fields:
#   policy_id                stable id
#   title                    short human name
#   status                   unresolved | investigating | hypothesis_leading | resolved | rejected
#   question                 the open question in one line
#   options                  candidate answers (each: id + description)
#   supporting_observation   evidence that nudges toward an option (may be empty)
#   contradicting_evidence   evidence against the leading option (may be empty)
#   confidence               none | low | medium | high
#   test_method              how we would resolve it (usually a probe submission)
#   leaderboard_experiment_id  filled once an EXP-* probe exists (else null)
#   internal_default         what MedNorm-VI does internally UNTIL resolved
registry: organizer_unresolved_policies
version: 1

policies:
  # --- position / matching ------------------------------------------------
  - policy_id: UNRES-POS-COORD-SPACE
    title: Position coordinate space
    status: unresolved
    question: Are positions code-point offsets, byte offsets, or something else?
    options:
      - {id: codepoint, description: Unicode code-point offsets (Python str indexing)}
      - {id: utf8_byte, description: UTF-8 byte offsets}
      - {id: utf16_unit, description: UTF-16 code-unit offsets}
    supporting_observation: Published example is consistent with code-point offsets.
    contradicting_evidence: ""
    confidence: low
    test_method: position-forensics over organizer sample input/output; probe submission.
    leaderboard_experiment_id: null
    internal_default: codepoint

  - policy_id: UNRES-POS-CHAR-VS-BYTE
    title: Character vs byte counting
    status: unresolved
    question: Does the grader count characters or bytes when comparing positions?
    options:
      - {id: character, description: count Unicode characters}
      - {id: byte, description: count encoded bytes}
    supporting_observation: ""
    contradicting_evidence: ""
    confidence: low
    test_method: byte-vs-codepoint delta analysis on multi-byte Vietnamese text.
    leaderboard_experiment_id: null
    internal_default: character

  - policy_id: UNRES-POS-LINE-ENDING
    title: Line-ending behavior
    status: unresolved
    question: Are CRLF sequences counted as 1 or 2 positions in graded offsets?
    options:
      - {id: lf_normalized, description: CRLF collapsed to LF before offsetting}
      - {id: raw_crlf, description: raw CRLF, each byte/char counted}
    supporting_observation: ""
    contradicting_evidence: ""
    confidence: low
    test_method: CRLF/LF systematic-shift detection in position-forensics.
    leaderboard_experiment_id: null
    internal_default: raw_crlf

  - policy_id: UNRES-POS-INTERVAL
    title: Interval convention
    status: unresolved
    question: "Is the graded interval end-exclusive [start,end) or end-inclusive [start,end]?"
    options:
      - {id: half_open, description: "end-exclusive [start, end)"}
      - {id: closed, description: "end-inclusive [start, end]"}
    supporting_observation: Published example length matches half-open (end-start == len).
    contradicting_evidence: ""
    confidence: medium
    test_method: inclusive/exclusive evidence in position-forensics; probe.
    leaderboard_experiment_id: null
    internal_default: half_open

  - policy_id: UNRES-MATCH-MODE
