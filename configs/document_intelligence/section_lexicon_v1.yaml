# MedNorm-VI — L1 section-header lexicon (v1)
# ------------------------------------------------------------------------------
# Versioned, EXTENSIBLE inventory of section-header aliases. These are
# representative examples, NOT a claim of exhaustive coverage. Aliases are
# matched against a normalized (casefold + accent-stripped + whitespace) view of
# short, header-like lines; a fuzzy hit additionally requires structural evidence
# (see configs/document_intelligence/base.yaml::sections).
#
# A section is EVIDENCE, not an absolute semantic rule. L1 stores section context
# + provenance; it never assigns final assertions. `prior_label`/`prior_strength`
# are hints later layers may weigh and local text may override.
version: 1
lexicon_version: 1

categories:
  - category: medical_history
    semantic_group: history
    prior_label: isHistorical
    prior_strength: 0.6
    aliases:
      - {form: "Tiền sử bệnh", language: vi, accent: accented}
      - {form: "Tiền sử", language: vi, accent: accented}
      - {form: "Bệnh sử", language: vi, accent: accented}
      - {form: "Tiền căn", language: vi, accent: accented}
      - {form: "Past medical history", language: en}
      - {form: "Medical history", language: en}
      - {form: "PMH", language: en, abbreviation: true}
    positive_examples: ["Tiền sử:", "PAST MEDICAL HISTORY"]
    negative_examples: ["Bệnh nhân có tiền sử hút thuốc lá."]

