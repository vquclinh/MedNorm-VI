# MedNorm-VI — L1 Document Intelligence configuration (base)
# ------------------------------------------------------------------------------
# Deterministic structural parsing only. L1 identifies structure ("list-like",
# "table-like", "possible section header") and NEVER claims a medical entity was
# detected. original_text is immutable and is the sole source of output offsets.
version: 1
builder_version: l1-1a

# --- Input loading ---
io:
  encoding: utf-8            # strict; invalid UTF-8 is an error, never silently repaired
  bom_policy: preserve       # preserve | strip | error  (preserve keeps the BOM in original_text)
  # Newlines are NEVER normalized in original_text; the style is only recorded.

# --- Normalization views (built on COPIES; every view maps back to original) ---
# Each view is an ordered list of independently toggleable stages. Available
# stages: nfc, casefold, whitespace_collapse, punctuation_alias, decimal_view,
# accent_strip. Views are for matching/retrieval ONLY — never output coordinates.
normalization:
  views:
    match:  [nfc, casefold, whitespace_collapse, punctuation_alias, decimal_view]
    accent: [nfc, casefold, whitespace_collapse, punctuation_alias, decimal_view, accent_strip]
  # The view structural matchers (sections) use for accent/case-insensitive recall:
  matching_view: accent

# --- Sentence-like segmentation ---
sentences:
  # Characters that may terminate a sentence (period handled with abbreviation guards).
  terminators: [".", "!", "?", "…", ";"]
  newline_is_boundary: true       # a newline separates sentence-like spans
  # A period is NOT a boundary when preceded by a known abbreviation or when it
  # sits between digits (decimal). See sentences.py for the deterministic guards.

# --- List-marker detection ---
lists:
  ordered_markers: ["\\d+[.)]", "\\(\\d+\\)", "[a-zA-Z][.)]"]   # 1.  1)  (1)  a.  a)
  bullet_markers:  ["-", "–", "—", "*", "•", "·", "▪", "‣", "◦"]
  # Indentation (leading spaces/tabs, tab counted as 1) informs nesting depth.

# --- Table-like / key-value row detection ---
table_rows:
  min_colon_pairs: 1              # "name: value" style
  key_value_regex: "^[^:]{1,60}:\\s*\\S"
  delimiters: [":", ";", "\\t"]
  # A row is table_like when it shows repeated delimiters/aligned name:value pairs.

# --- Section-header detection ---
sections:
  lexicon: section_lexicon_v1.yaml
  fuzzy_threshold: 0.86           # min normalized similarity for a fuzzy header alias hit
  require_structural_evidence: true  # fuzzy hits also need a header-like structural signal
  max_header_chars: 64            # headers are short, isolated lines
  colon_terminated_bonus: true    # "Diagnosis:" style strongly signals a header
  blank_line_context_bonus: true  # surrounding blank lines strengthen a header

# --- Tokenization (canonical L1 token view; NOT a model tokenizer) ---
tokens:
  # Keep decimals, units, slash strengths, hyphenated forms, and diacritics intact;
  # split on whitespace and punctuation boundaries deterministically.
  emit_delimiter_tokens: true

# --- Validation strictness ---
validation:
  strict: true                    # invariant violations fail fast (errors)
  require_full_line_coverage: true

# --- Determinism ---
determinism:
  id_zero_pad: 4                  # node ids like sec-0001, line-0007, tok-000012
