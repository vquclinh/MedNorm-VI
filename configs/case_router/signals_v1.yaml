# MedNorm-VI — Case Router signal inventory (v1)
# ------------------------------------------------------------------------------
# Versioned, extensible cue inventories + per-case signals. Cue groups are
# regexes matched case-insensitively against a line's original text (accented and
# unaccented Vietnamese variants are listed explicitly). Structural/derived
# detectors are computed in code from the L1 DocumentGraph and specialist output.
# These are EVIDENCE weights, not calibrated probabilities.
version: 1
lexicon_version: 1

cue_groups:
  units:
    - '\d\s?(mg|mcg|µg|ug|g|kg|ml|mL|l|iu|ui|u)\b'
    - '\bmg/m?l\b'
    - '\d\s?%'
  routes:
    - '\b(po|iv|im|sc|sl|pr|inh)\b'
    - '\b(oral|intravenous|intramuscular|subcutaneous|topical|inhaled|sublingual|rectal)\b'
    - '\b(uong|uống|tiem bap|tiêm bắp|duoi da|dưới da|ngam duoi luoi|đặt)\b'
  frequencies:
    - '\b(qd|bid|tid|qid|prn|qhs|qam|od|nocte)\b'
    - '\bq\d+h\b'
    - '\b(daily|once daily|twice daily)\b'
    - '\b(moi ngay|mỗi ngày|ngay \d lan|ngày \d lần|sang|sáng|chieu|chiều|toi|tối)\b'
  release_forms:
    - '\b(ir|er|xr|xl|sr|cr)\b'
    - '\b(extended release|sustained release|controlled release|delayed release)\b'
    - '\b(phong thich keo dai|phóng thích kéo dài|giai phong cham|giải phóng chậm)\b'
  dose_forms:
    - '\b(tablet|tab|capsule|cap|solution|suspension|syrup|injection|vial|ampoule|amp|cream|ointment|patch|inhaler|drops|powder)\b'
    - '\b(vien|viên|vien nen|viên nén|nang|dung dich|dung dịch|hon dich|hỗn dịch|siro|tiem|tiêm|thuoc mo|thuốc mỡ|mieng dan|miếng dán|bot|bột)\b'
  prn:
    - '\b(prn|as needed)\b'
    - '\b(khi can|khi cần)\b'
  lab_units:
    - '\b(mg/dl|mmol/l|g/l|g/dl|u/l|iu/l|ng/ml|pg/ml|mmol|umol/l|µmol/l)\b'
    - '\b(cells?/[uµ]l|10\^?\d+/l|mm3|/mm3)\b'
    - '\b(mmhg|bpm)\b'
    - '(°c|℃)'
  reference_range:
    - '\(\s*\d+([.,]\d+)?\s*[-–]\s*\d+([.,]\d+)?\s*\)'
    - '\[\s*\d+([.,]\d+)?\s*[-–]\s*\d+([.,]\d+)?\s*\]'
    - '\b(ref|reference|tham chieu|tham chiếu|binh thuong|bình thường)\b'
  flags:
    - '\b(H|L|high|low|cao|thap|thấp)\b'
    - '[↑↓]'
  qualitative:
    - '\b(positive|negative|reactive|non-reactive|detected|not detected|trace)\b'
    - '\b(am tinh|âm tính|duong tinh|dương tính|co|có|khong|không phat hien|không phát hiện)\b'
  negation:
    - '\b(khong|không|chua|chưa|phu nhan|phủ nhận|khong ghi nhan|không ghi nhận|am tinh voi|âm tính với|loai tru|loại trừ)\b'
    - '\b(no|not|denies|negative for|without)\b'
  history:
    - '\b(tien su|tiền sử|benh su|bệnh sử|tien can|tiền căn|truoc nhap vien|trước nhập viện|da tung|đã từng|truoc day|trước đây)\b'
    - '\b(history of|previously|prior|past medical history|pmh)\b'
  family:
    - '\b(gia dinh|gia đình|bo|bố|cha|me|mẹ|anh|chi|chị|em|ho hang|họ hàng|nguoi than|người thân)\b'
    - '\b(family history|father|mother|sibling|maternal|paternal)\b'
  contrast:
    - '\b(nhung|nhưng|tuy nhien|tuy nhiên|however|but)\b'
  temporal:
    - '\b(\d+\s?(nam|năm|thang|tháng|ngay|ngày|tuan|tuần))\b'
    - '\b(hom qua|hôm qua|hien tai|hiện tại|gan day|gần đây|since|ago)\b'
  abbreviations:
    - '\b(THA|DTD|ĐTĐ|COPD|CKD|MI|HTN|DM|BN|CLS)\b'

# Section category (from L1) → per-case prior weight (evidence, not assertion).
section_priors:
  home_medications:          {C1: 0.40, C4: 0.20}
  pre_admission_medications: {C1: 0.40, C4: 0.20}
  current_medications:       {C1: 0.40}
  laboratory:                {C2: 0.45}
  family_history:            {C4: 0.45}
  medical_history:           {C4: 0.35}
  diagnosis:                 {C3: 0.20}
  symptoms:                  {C3: 0.20}

# Per-case signals. `detector` is `cue.<group>`, `structural.<name>`, or
# `derived.<name>` (derived signals need specialist output; see the router).
cases:
  C1:
    name: medication_list
    activated_specialists: [medication]
    signals:
      - {name: list_item,       kind: soft, weight: 0.35, detector: structural.is_list_item}
      - {name: strength,        kind: soft, weight: 0.40, detector: cue.units}
      - {name: route,           kind: soft, weight: 0.30, detector: cue.routes}
      - {name: frequency,       kind: soft, weight: 0.30, detector: cue.frequencies}
      - {name: dose_form,       kind: soft, weight: 0.25, detector: cue.dose_forms}
      - {name: release_form,    kind: soft, weight: 0.20, detector: cue.release_forms}
      - {name: prn,             kind: soft, weight: 0.20, detector: cue.prn}
      - {name: med_section,     kind: soft, weight: 0.40, detector: structural.section_prior}
  C2:
    name: lab_semi_structured
    # A key/value or table row alone is NOT enough — C2 requires lab-specific
    # evidence, so ordinary "key: value" prose (e.g. family history) does not
    # route to C2.
    #
    # Audit 0053: that intent was previously stated here but NOT enforced. It was
    # expressed only through weights, and the weights permit it:
    # `key_value_row 0.30 + table_row 0.25 = 0.55`, already past the 0.50
    # activation threshold with zero laboratory content. Audit 0052 measured the
    # result on the governed validation split — narrative sentences scoring C2 at
    # 0.85 from `key_value_row + table_row + numeric_value`, and E2 (correctly
    # gated on C2) producing 11 false positives and 0 true positives.
    #
    # `required_evidence` enforces it: at least one of these signals must fire.
    # `numeric_value` is deliberately EXCLUDED — it matches any numeral, so it was
    # present in every one of the measured false positives and including it would
    # leave the defect untouched. A real lab row satisfies this list trivially
    # ("WBC: 14,43 G/L (4-10)" fires lab_unit and reference_range); a prose
    # sentence containing a colon and a number does not.
    required_evidence: [numeric_key_value, lab_unit, reference_range, flag, lab_section]
    activated_specialists: [laboratory]
    signals:
      - {name: key_value_row,   kind: soft, weight: 0.30, detector: structural.is_key_value_row}
      - {name: table_row,       kind: soft, weight: 0.25, detector: structural.is_table_row}
      - {name: semicolon_pairs, kind: soft, weight: 0.25, detector: structural.semicolon_pairs}
      - {name: lab_unit,        kind: soft, weight: 0.35, detector: cue.lab_units}
      - {name: reference_range, kind: soft, weight: 0.30, detector: cue.reference_range}
      - {name: flag,            kind: soft, weight: 0.20, detector: cue.flags}
      - {name: numeric_value,   kind: soft, weight: 0.30, detector: structural.numeric_present}
      - {name: lab_section,     kind: soft, weight: 0.40, detector: structural.section_prior}
      # A key/value row whose VALUE is numeric. This is the signal that
      # distinguishes "PLT: 250" from "... ( 1,2 ) : phẫu thuật", and it
      # accepts a unit-less result (spec §14.2).
      - {name: numeric_key_value, kind: soft, weight: 0.30, detector: structural.numeric_key_value}
  C3:
    name: clinical_narrative
    activated_specialists: [narrative_hook]
    signals:
      - {name: narrative,       kind: soft, weight: 0.30, detector: structural.is_narrative}
      - {name: multiple_clauses,kind: soft, weight: 0.20, detector: structural.multiple_clauses}
      - {name: narr_section,    kind: soft, weight: 0.20, detector: structural.section_prior}
  C4:
    name: assertion_heavy
    activated_specialists: [assertion_evidence]
    # A single strong assertion cue (negation) should activate C4; history/family
    # cues combine with section priors. These remain EVIDENCE, never final labels.
    signals:
      - {name: negation,        kind: soft, weight: 0.50, detector: cue.negation}
      - {name: history,         kind: soft, weight: 0.40, detector: cue.history}
      - {name: family,          kind: soft, weight: 0.40, detector: cue.family}
      - {name: contrast,        kind: soft, weight: 0.20, detector: cue.contrast}
      - {name: temporal,        kind: soft, weight: 0.20, detector: cue.temporal}
      - {name: assertion_section,kind: soft,weight: 0.35, detector: structural.section_prior}
  C5:
    name: abbreviation_noise
    activated_specialists: [abbreviation_hook]
    signals:
      - {name: abbreviation,    kind: soft, weight: 0.35, detector: cue.abbreviations}
      - {name: uppercase_short, kind: soft, weight: 0.30, detector: structural.uppercase_shortform}
      - {name: unaccented,      kind: soft, weight: 0.20, detector: structural.unaccented}
      - {name: mixed_language,  kind: soft, weight: 0.20, detector: structural.mixed_language}
  C6:
    name: ambiguous_linking
    # C6 needs MEANINGFUL linking ambiguity — NOT routine progressive boundary
    # candidates. Signals: a known medication named without an identity-critical
    # strength (incomplete identity for RxNorm), an unknown medication name, or
    # conflicting strength evidence for the same ingredient.
    activated_specialists: [linking_hook]
    signals:
      - {name: incomplete_identity, kind: soft, weight: 0.50, detector: derived.med_incomplete_identity}
      - {name: unknown_medication,  kind: soft, weight: 0.50, detector: derived.unknown_medication}
      - {name: conflicting_strength,kind: soft, weight: 0.50, detector: derived.conflicting_strength}
  C7:
    name: overlap_duplicates
    # C7 needs genuine overlap/duplication — overlaps BETWEEN different parses or
    # specialists, or the same surface at different positions — NOT the boundary
    # alternatives of a single parse.
    activated_specialists: [overlap_hook]
    signals:
      - {name: repeated_surface,      kind: soft, weight: 0.45, detector: derived.repeated_surface}
      - {name: cross_parse_overlap,   kind: soft, weight: 0.45, detector: derived.cross_parse_overlap}
