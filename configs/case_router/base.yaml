# MedNorm-VI — L2 Case Router configuration (Phase 1B, base)
# ------------------------------------------------------------------------------
# Deterministic MULTI-LABEL routing over L1 structural nodes. A route tag is a
# PROCESSING CASE, not an entity type and not a final prediction — it only
# activates downstream specialists. A node may carry several routes at once.
version: 1
router_version: r1b

signals_file: signals_v1.yaml

# A route tag is attached when its score >= activate. `strong` marks a
# high-confidence route (used only for reporting/uncertainty, never exclusivity).
thresholds:
  activate: 0.50
  strong: 0.80
  # C3 (narrative) is the low-structure fallback; attach it when no structured
  # route (C1/C2) fires on a non-empty text node.
  narrative_fallback: true

# Which L1 node kinds are routable. Routing happens at the LINE level; the line's
# child structures (list_item / table_row / cells / tokens) supply signals.
routable_kinds: [line]

# Uncertainty: emit a warning when the top route score is within this margin of
# the activate threshold (ambiguous routing).
uncertainty_margin: 0.10
