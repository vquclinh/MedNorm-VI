# 0082 - OntoFusion: pretrained-only multi-view linking.
#
# A SECOND linker beside GraphCENT 0080, never a replacement, so the ablation stays one
# variable at a time:
#     0080 = E3 entities         + GraphCENT
#     0081 = contextual entities + GraphCENT
#     0082 = contextual entities + OntoFusion
#
# Nothing is trained, fine-tuned or adapted, and no model is added. The deployed stack is
# exactly the certified GraphCENT stack; sparse character retrieval contributes no
# parameters. The KB paths, retriever registry, dense caches and model manifest all come
# from configs/pipeline/graphcent_0080.yaml - this profile deliberately does not restate
# them, so the two cannot drift apart.
version: 1
name: ontofusion_0082

# --- query reformulation (BeLink GenQR, KRISSBERT contextual query) ----------------------
# Qwen writes two extra RETRIEVAL QUERIES from the mention's document context. They never
# become entities, never touch spans or offsets, and any code-shaped output is discarded.
use_reformulation: true

# --- multi-view retrieval (CENT: diverse and small, not deep) ---------------------------
# The raw Vietnamese mention ALWAYS participates. The English view goes only to the
# multilingual encoders: the governed lexical indices hold Vietnamese/ICD surface forms,
# where an English query retrieves noise.
retrieval:
  sparse_top_k: 4          # BioSyn-style character lexical view
  dense_top_k: 4           # per dense retriever (SapBERT everywhere, ClinLinker diagnosis-only)
  candidate_cap: 10        # deterministic union cap, 8-12 is the intended range
  sparse_views: [raw, canonical_vi]
  dense_views: [raw, canonical_vi, canonical_en]

# --- sparse lexical view -----------------------------------------------------------------
# Reuses the repository's existing inverted character n-gram index for the shortlist, then
# reranks it by character n-gram similarity. No global TF-IDF matrix is built.
sparse:
  ngram_n: 3
  strip_accents: true
  shortlist: 50            # cheap candidates fed to the similarity rerank

# --- confidence variants -----------------------------------------------------------------
# `high` requires INDEPENDENT deterministic support for the selected concept. These are not
# the stale 0080 tier thresholds and were not tuned against any answer key; every input is
# stored per mention so another policy can be derived later without re-running Qwen.
confidence:
  min_retrievers: 2                 # found by two independent retrievers, or
  min_views: 2                      # found from two independent query views, or
  exact_alias_is_sufficient: true   # an exact governed alias match

# --- multi-code --------------------------------------------------------------------------
# Default is ONE concept or NONE. Alternative granularities are not multiple concepts.
allow_multi_code: false
