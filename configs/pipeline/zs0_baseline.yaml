# MedNorm-VI — ZS0 pure zero-shot submission baseline (Audit 0048)
# =============================================================================
# No weights this project fitted. No head this project initialized. No external
# API. No internet at runtime. No internal_test.
#
# E4 is RETIRED_FROM_ACTIVE_STACK. E3 is excluded here not because it is bad —
# it is the best mention expert the project has (exact F1 0.7103, Audit 0033) —
# but because it is FINE-TUNED, and ZS0's whole purpose is to establish what a
# purely pretrained stack achieves.
version: zs0-baseline-v1
name: zs0_baseline
profile_version: zs0-baseline-v1

l1_config: configs/document_intelligence/base.yaml
router_config: configs/case_router/base.yaml
medication_config: configs/medication/grammar_v1.yaml
laboratory_config: configs/laboratory/parser_v1.yaml
resolver_config: configs/resolution/zs0_conservative_v1.yaml
icd_index: indices/icd10_vi/tt06-2026/index.json
rxnorm_index: indices/rxnorm/prescribable-2026-07-06/index.json
checkpoint_root: models/checkpoints/zs0
expected_documents: 100
allow_specialist_fallback: false

feature_flags:
  enable_e1_medication_grammar: true
  enable_e2_laboratory_parser: true
  # FINE-TUNED in this project. Excluded so ZS0 measures pretrained-only.
  enable_e3_vihealthbert: false
  # RETIRED_FROM_ACTIVE_STACK (Audit 0048).
  enable_e4_phobert_w2ner: false
  # Its MRC task head is randomly initialized; an untrained head is not
  # zero-shot, it is noise with a confident interface.
  enable_e5_xlmr_mrc: false
  # Pretrained, pinned. Enabled for ZS0-B and ZS0-C.
  enable_e6_gliner: true
  # Pretrained, pinned. Enabled for ZS0-C only.
  enable_e7_qwen_proposer: true
  # Audit 0034 measured deterministic L4 v1 BELOW the E3-only baseline.
  enable_l4_deterministic_v1: false
  # No trained checkpoint exists.
  enable_l4_learned_v2: false

# No checkpoint of any trained expert is required or expected.
specialist_requires_checkpoints: []
full_requires_checkpoints: []

arms:
  ZS0-A: {components: [E1_medication_grammar, E2_laboratory_parser]}
  ZS0-B: {components: [E1_medication_grammar, E2_laboratory_parser,
                       E6_gliner_open_type]}
  ZS0-C: {components: [E1_medication_grammar, E2_laboratory_parser,
                       E6_gliner_open_type, E7_qwen_cascade]}

resolver:
  contract: zs0-conservative-resolver-v1
  # Every threshold, in one place. No search was performed.
  min_single_expert_score: 0.50
  min_agreement_score: 0.30
  max_wrong_type_risk: 0.60
  near_complete_overlap_iou: 0.80
  merges_by: coordinate_identity_only
  text_only_dedup_across_positions: false
  abstains_when_evidence_insufficient: true
  changes_span_during_linking: false

assertions:
  contract: zs0-assertion-v1
  labels: [isNegated, isFamily, isHistorical]
  deterministic_first: true
  qwen_only_when_uncertain: true
  scope_characters: 60
  empty_means_insufficient_evidence_not_false: true

linking:
  contract: zs0-linking-v1
  candidate_order: [alias_exact, lexical, dense, reranker]
  top_k: 5
  alias_confidence: 0.99
  qwen_may_select_from_candidates_only: true
  qwen_may_generate_codes: false
  every_code_verified_against_snapshot: true
  empty_beats_invented: true

organizer:
  authorization: I_AUTHORIZE_ZS0_ORGANIZER_INFERENCE_AND_PACKAGE
  committed_run_flag: false
  committed_confirmation_value: ""
  expected_documents: 100
  output_dir: output
  zip_path: output.zip

permitted:
  local_training: false
  internal_test_access: false
  external_model_api: false
  e3_fine_tuned_checkpoint: false
  e4_any_use: false
  e5_random_task_head: false
