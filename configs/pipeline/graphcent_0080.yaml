# GraphCENT 0080 - multi-encoder retrieval + ontology context + constrained Qwen3-8B.
#
# Frozen weights throughout. No fine-tuning, no LoRA, no adapters.
#
# Public evidence this profile is built around: emitting nothing (all-null) scored 14.3749
# while the full governed linker scored 12.4757. Candidate emission is therefore
# precision-first and NULL is the default at every stage.
version: 1
name: graphcent_0080

mode: graphcent_candidate_only        # or graphcent_joint_safe_span
seed_entities: ""                     # E3-only organizer JSON directory (required)
seed_run_config: configs/pipeline/full_v1.yaml   # must be E3-only; checked at startup

# --- governed knowledge base (no external ids ever enter retrieval) -------------------
icd_index: indices/candidate/icd10_vi/competition-v4.1/index.json
rxnorm_index: indices/candidate/rxnorm/competition-v3/index.json
rxnorm_structured: artifacts/rxnorm_structured/0074/structured.jsonl

# --- frozen pretrained retrievers -----------------------------------------------------
# `revision` is resolved and recorded at download time; it is never assumed here.
# Pooling is NOT interchangeable: SapBERT/ClinLinker are read at CLS, the BioBERT sentence
# model is mean-pooled. Overriding these silently degrades retrieval.
retrievers:
  sapbert_xlmr:
    enabled: true
  biobert_mnli:
    # DISABLED BY DEFAULT. The model card declares cc-by-nc-3.0 (non-commercial). The code is
    # complete and supported; enabling it is an explicit decision, never a silent default.
    # Use configs/pipeline/graphcent_0080_full_research.yaml to turn it on.
    enabled: false
  clinlinker_kb_gp:
    # Model card declares apache-2.0. No review gate.
    enabled: true
    roles: [diagnosis]                # medication evidence is weak; diagnosis only

licence_overrides_accepted: []        # e.g. [biobert_mnli] once explicitly reviewed

model_root: /content/graphcent_models
cache_root: /content/graphcent_cache

# --- retrieval shape (CENT small-candidate-context principle) -------------------------
top_k_per_retriever: 5
max_candidate_context: 10

# --- precision gates ------------------------------------------------------------------
tiers:
  allow_tier_a: true                  # exact governed label/alias + selected
  allow_tier_b: true                  # selected + >=2 independent retrievers, no conflict
  allow_tier_c: true                  # RxNorm structured agreement, no conflict
  min_retrievers_for_tier_b: 2

# --- boundary policy ------------------------------------------------------------------
allow_boundary_changes: false         # true only in graphcent_joint_safe_span
drug_regimen_expansion: true
safe_bridge_completion: true

# --- disambiguator --------------------------------------------------------------------
qwen_model_root: /content/qwen3-8b-local
max_new_tokens: 256
reasoning_mode: none                  # none | brief   (no ToT/GoT in the first run)

# Assertions are NOT redesigned here. The E3 path is preserved exactly.
preserve_e3_assertions: true
freeze_e3_types: true
