version: 1
name: full_pipeline_v1
l1_config: configs/document_intelligence/base.yaml
router_config: configs/case_router/base.yaml
medication_config: configs/medication/grammar_v1.yaml
laboratory_config: configs/laboratory/parser_v1.yaml
resolver_config: configs/resolution/resolver_v1.yaml
icd_index: indices/icd10_vi/tt06-2026/index.json
# Active RxNorm index consumed by the linker. Audit 0014 kept the CONSERVATIVE
# default (Prescribable) until BTC publishes the upgraded task and clarifies the
# candidate/membership policy. To switch snapshots, point this at the Full index
# below (config-only change; the linker is snapshot-agnostic).
rxnorm_index: indices/rxnorm/prescribable-2026-07-06/index.json
# Registry of available RxNorm snapshots and the selection policy. See
# configs/linking/rxnorm_snapshots_v1.yaml for the full contract.
rxnorm_snapshots:
  prescribable:
    index: indices/rxnorm/prescribable-2026-07-06/index.json
    snapshot_id: rxnorm-local-75a100c0b70b67d0
    manifest: data/manifests/rxnorm-prescribable-2026-07-06.yaml
  full:
    index: indices/rxnorm/full-2026-07-06/index.json
    snapshot_id: rxnorm-full-local-f77a33c352817f36
    manifest: data/manifests/rxnorm-full-2026-07-06.yaml
rxnorm_selection:
  active: prescribable
  modes: [prescribable_only, full_only, full_prefer_prescribable, ablation_full_vs_prescribable]
  current_prescribable_preference: true
checkpoint_root: models/checkpoints/full_v1
expected_documents: 100
allow_specialist_fallback: true
specialist_requires_checkpoints:
  - mention/vihealthbert
  - assertion/assertion_hydra
full_requires_checkpoints:
  - mention/vihealthbert
  - mention/phobert_w2ner
  - mention/xlmr_mrc
  - mention/gliner
  - assertion/assertion_hydra
  - retrieval/icd_dense
  - retrieval/rxnorm_dense
  - reranker/cross_encoder
  - qwen_lora
  - calibration/full_v1
profiles:
  deterministic:
    neural: false
    requires_checkpoints: false
  specialist:
    neural: optional
    requires_checkpoints: configurable
    # L4 Boundary & Type Resolver v1 — DISABLED, on measured evidence (Audit 0034).
    #
    # The exact four-way ablation on the governed internal_test split scored:
    #   Arm 1  E3 neural only                       exact F1 0.7103
    #   Arm 3  unified L3 lattice, before L4        exact F1 0.6963  (-0.0139)
    #   Arm 4  unified lattice, after L4 v1         exact F1 0.7039  (-0.0063)
    #
    # The resolver recovers roughly half of what merging E1/E2 into the lattice
    # costs, but Arm 4 still sits BELOW the neural-only baseline: on this
    # narrative corpus the deterministic experts contribute only false positives
    # (Arm 2 exact F1 0.0000, 79 proposals, 0 exact matches). Enabling the
    # resolver here would therefore lower the only measured score we have.
    #
    # Turn this on only when an ablation shows Arm 4 >= Arm 1. Thresholds must be
    # searched on the VALIDATION split, never on internal_test, which is the
    # held-out split every reported number depends on.
    boundary_type_resolver_v1:
      enabled: false
      config: configs/resolution/boundary_type_resolver_v1.yaml
      decided_in: docs/audits/0034-l3-span-lattice-l4-resolver-and-ablation.md
  full:
    neural: true
    requires_checkpoints: true
