# PUBLIC-BEST PROFILE - explicit historical reproduction of the scored Audit-0073 run.
#
# SCORED 2026-08-01: 12.4757 | WER 82.7090 | J_assertion 18.6187 | J_candidates 4.2570
# Submission SHA-256 0995c7c7a070460a28d76f1dfdd24b3cc0e7d986e90173a583eadf214f551a5c
#
# THIS PROFILE DELIBERATELY SELECTS A KNOWN DEFECT.
#
# `row_order: legacy_0073_misaligned_file_positions` reads the frozen sorted(concept_id)
# dense cache with documents-file positions, so ICD mentions are scored against RxNorm
# vectors. That is a bug. It is also, measured on the public leaderboard, the better
# candidate stack: correcting it scored 12.3922 (-0.0835). See Audit 0074 §13 and the
# 0075 sprint result.
#
# It is NOT called "corrected" anywhere, is never inferred, and the runtime prints a warning
# to stderr when this order is selected. Provenance over tidiness: we submit what measured
# best and we say exactly why it is odd.
#
# Everything else is byte-identical to 0073: specialist mode, E3, L4, assertions, spans,
# types, RxNorm linker, dotted serialization, NULL shadow, Embedding-4B + Reranker-4B.
# Deployed: 8,178,561,029 (< 9B).
#
# ROLLBACK: configs/pipeline/full_v1.yaml (lexical_v3).
linker_backend: semantic_s1_0072
semantic_linker:
  # No user-specific path is a repository default. Supply the Colab model root by any of:
  #   1. --semantic-model-root on the public-inference script  (highest precedence)
  #   2. this field
  #   3. export MEDNORM_SEMANTIC_MODEL_ROOT=/content/drive/MyDrive/MedNorm-VI/0072/models
  # Unset in all three -> readiness fails closed.
  model_root: ""
  documents: artifacts/semantic/0071/documents.jsonl
  dense_index: artifacts/semantic/0072/cache/S1_doc_vectors.pt
  icd_v41_index: indices/candidate/icd10_vi/competition-v4.1/index.json
  # RxNorm is ALSO routed through frozen S1: the 0072 benchmark was ~1,803 RXNORM of 2,000
  # queries, so the selected metrics are mostly RxNorm. Lexical Top-20 + dense Top-50 +
  # reranker, and no hierarchy policy - H2 is ICD-only by construction.
  rxnorm_index: indices/candidate/rxnorm/competition-v3/index.json
  rxnorm_topk: 20
  device: cuda
  embed_batch_size: 16
  rerank_batch_size: 8
  v3_topk: 20
  v41_topk: 20
  dense_topk: 50
  candidate_limit: 20
  null_mode: shadow
  # Explicit, not defaulted: this is the whole point of the variant.
  row_order: legacy_0073_misaligned_file_positions

# ---- inherited from full_v1.yaml, unchanged ----
version: 1
name: full_pipeline_v1
l1_config: configs/document_intelligence/base.yaml
router_config: configs/case_router/base.yaml
medication_config: configs/medication/grammar_v1.yaml
laboratory_config: configs/laboratory/parser_v1.yaml
# ACTIVE ICD INDEX (Audit 0058A). Competition KB v3, snapshot
# `competition-kb-v3-candidate-4d206538e7d24c32`, deterministic_index_hash
# b050a2d5ead90c8410101d257b08b347c129f5a8faa713d7e5f2757c7931a975.
# 15,308 searchable records; suspect names indexed with a ranking penalty rather
# than excluded; hierarchy is advisory and may never offer a candidate on its own.
# ROLLBACK: indices/icd10_vi/tt06-2026/index.json (retained, unmodified).
icd_index: indices/candidate/icd10_vi/competition-v3/index.json
# ACTIVE RxNorm INDEX (Audit 0058A). Same v3 snapshot, deterministic_index_hash
# d3c45f349bad1532135b70214c48e54c270ede6ae6988e1444a9949887d92ac3.
# 211,949 records = 82,429 searchable + 129,520 closure-only graph endpoints.
# Closure-only concepts are absent from the postings, dropped by the linker with
# DROP_CLOSURE_ONLY, and refused by L9 with kb.candidate_not_final_eligible.
#
# Audit 0014's conservative Prescribable default stood until here. It is superseded
# for the competition runtime, not deleted: v3 is *derived from* Prescribable, adds
# only source-supported closure endpoints from the local Full package, and emits
# nothing the Prescribable subset did not already permit as a candidate.
# ROLLBACK: indices/rxnorm/prescribable-2026-07-06/index.json (retained, unmodified).
rxnorm_index: indices/candidate/rxnorm/competition-v3/index.json
# Registry of available RxNorm indices and the selection policy. See
# configs/linking/rxnorm_snapshots_v1.yaml for the full contract.
rxnorm_snapshots:
  competition_v3:
    index: indices/candidate/rxnorm/competition-v3/index.json
    snapshot_id: competition-kb-v3-candidate-4d206538e7d24c32
    manifest: data/derived/kb_freeze/0058_competition_candidate_v3/competition_snapshot_manifest_v1.json
  prescribable:
    index: indices/rxnorm/prescribable-2026-07-06/index.json
    snapshot_id: rxnorm-local-75a100c0b70b67d0
    manifest: data/manifests/rxnorm-prescribable-2026-07-06.yaml
  full:
    index: indices/rxnorm/full-2026-07-06/index.json
    snapshot_id: rxnorm-full-local-f77a33c352817f36
    manifest: data/manifests/rxnorm-full-2026-07-06.yaml
rxnorm_selection:
  active: competition_v3
  modes: [competition_v3_only, prescribable_only, full_only, full_prefer_prescribable, ablation_full_vs_prescribable]
  # Still true of the *candidate* policy: v3 emits only concepts that were
  # prescribable-searchable. The Full package contributes graph reach, never a code.
  current_prescribable_preference: true
  rollback:
    icd_index: indices/icd10_vi/tt06-2026/index.json
    rxnorm_index: indices/rxnorm/prescribable-2026-07-06/index.json
# Governed decoding profile (Audit 0060 §4). `competition_top1` is the canonical
# profile for competition runs: under Jaccard a second candidate only pays when it is
# more likely right than wrong, and nothing here produces a calibrated probability that
# could establish that. `competition_adaptive` reproduces the Audit-0058 behaviour and
# is retained as an explicit experiment only.
decoding_profile: competition_top1
checkpoint_root: models/checkpoints/full_v1
# No expert_settings.e3_vncorenlp_dir is configured in the shipped active
# profile. E3 therefore uses the verified default/pre-segmented-source path.
# If a profile explicitly sets e3_vncorenlp_dir, VnCoreNLP becomes mandatory for
# that run: readiness checks the configured directory/JAR/runtime dependencies
# and runtime fails closed instead of silently falling back to segmenter=None.
#
# ACTIVE E3 CHECKPOINT (Audit 0062). Selected from the governed profile registry
# `configs/models/e3_checkpoint_profiles.yaml`, which declares both artifacts with
# their digests. Before this milestone the active artifact was a default constant in
# `mention_factory/experts/e3_vihealthbert.py`, so rolling back meant editing source;
# a rollback that needs a code change is not one anybody performs under pressure.
#
# The digest is enforced twice before a byte is deserialized: `fingerprint_checkpoint`
# refuses a mismatch, and `assert_load_is_permitted` refuses it again. This digest is
# NOT the trusted-legacy one, so the refined checkpoint is loaded with
# weights_only=True — the Audit-0056a pickle exception stays limited to the single
# file it was written for.
#
# ROLLBACK: set both keys to the `s1_full_training_v1` profile
#   e3_checkpoint_path: checkpoint/s1_mention_full_training_v1/best.pt
#   e3_expected_checkpoint_sha256: a64cc173a284e42ff4bc21b6e0914314d6ff2c6c13efd7fc04d7be0f9be1017c
# That artifact is unmodified and is what every scored submission to date ran on.
expert_settings:
  e3_checkpoint_path: checkpoint/e3_boundary_refinement_0062/best.pt
  e3_expected_checkpoint_sha256: 524ece1e7d190838cb8b1ce3b0a0f337bc5b8b7cc7cef70c4c3e0b0310adde3a
expected_documents: 100
allow_specialist_fallback: true
feature_flags:
  enable_e1_medication_grammar: true
  enable_e2_laboratory_parser: true
  # Preserved measured default from Audit 0033: E3 ViHealthBERT remains the only
  # enabled trained mention expert unless an ablation validates a wider lattice.
  enable_e3_vihealthbert: true
  # E4 PhoBERT-W2NER carried a flag here until Audit 0051. It is
  # RETIRED_FROM_ACTIVE_ARCHITECTURE and the flag is GONE, not set false: a dead
  # flag is a flag somebody can flip. PipelineConfig.load now REFUSES any profile
  # that still declares it, in this file or in any nested per-mode profile.
  enable_e5_xlmr_mrc: false
  enable_e6_gliner: false
  # Interface-only in this milestone. Do not execute or fabricate Qwen proposals.
  enable_e7_qwen_proposer: false
  # L4 ROUTE SELECTION (Audit 0056a). Exactly one route must be selected; L4 is not
  # optional, because L5-L9 consume EntityHypothesis and no other stage produces it.
  #
  # This key was `false` until Audit 0056a while the canonical deterministic
  # resolver ran on every document regardless — the profile was a false statement
  # about its own behaviour, and both L4 flags were inert. `true` is what has
  # actually executed since Audit 0052.
  #
  # Audit 0034's "before/after L4 v1" arms are reproduced by the ablation harness
  # (evaluation/l3_l4_ablation_v2.py), not by a runtime flag.
  enable_l4_deterministic_v1: true
  # Implemented in Phase 2, but no trained checkpoint exists yet. Enabling this
  # selects the learned route and FAILS CLOSED (readiness blocker
  # `l4_learned_not_ready:*`); it never falls back to the deterministic resolver.
  enable_l4_learned_v2: false
specialist_requires_checkpoints:
  # Audit 0056a: this list was parsed and never read. It is now enforced, so it must
  # name only real checkpoint-backed dependencies.
  #
  # `assertion/assertion_hydra` was REMOVED: L5's wired assertion path is
  # deterministic A1-A3 cue/scope logic (specialists/assertion/), it has no
  # checkpoint and the architecture plans none for it — the future learned slot is
  # the S2 head. Requiring a checkpoint that is not part of the design would make
  # `specialist` permanently NOT_READY for an asset nobody intends to produce.
  #
  # The E3 role is resolved through the E3 adapter, which is the authority on where
  # its digest-verified artifact actually lives (`e3_checkpoint_path`).
  - mention/vihealthbert
full_requires_checkpoints:
  - mention/vihealthbert
  # mention/phobert_w2ner is absent and refused by the loader: a retired expert
  # has no checkpoint and none is expected (Audits 0048, 0051).
  - mention/xlmr_mrc
  - mention/gliner
  - mention/qwen3_1_7b_proposer
  - resolution/learned_l4_v2
  - assertion/assertion_hydra
  - retrieval/icd_dense
  - retrieval/rxnorm_dense
  - reranker/cross_encoder
  - qwen_lora
  - calibration/full_v1
profiles:
  deterministic:
    neural: false
    requires_checkpoints: false
    feature_flags:
      enable_e1_medication_grammar: true
      enable_e2_laboratory_parser: true
      enable_e3_vihealthbert: false
      enable_e5_xlmr_mrc: false
      enable_e6_gliner: false
      enable_e7_qwen_proposer: false
      enable_l4_deterministic_v1: true
      enable_l4_learned_v2: false
  specialist:
    neural: optional
    requires_checkpoints: configurable
    feature_flags:
      enable_e1_medication_grammar: true
      enable_e2_laboratory_parser: true
      enable_e3_vihealthbert: true
      enable_e5_xlmr_mrc: false
      enable_e6_gliner: false
      enable_e7_qwen_proposer: false
      enable_l4_deterministic_v1: true
      enable_l4_learned_v2: false
    # RECORDED MEASUREMENT, NOT A RUNTIME SWITCH (corrected in Audit 0056a).
    #
    # This block previously read `boundary_type_resolver_v1: {enabled: false}` and
    # was described as DISABLING L4 v1. Two things were wrong with that. First,
    # nothing reads it: `PipelineConfig.load` consumes only the TOP-LEVEL
    # `feature_flags`, so every key under `profiles.*` other than `feature_flags`
    # (which is scanned for retired E4 flags) is inert. Second, the canonical
    # deterministic L4 ran on every document regardless — it cannot be disabled,
    # because L5-L9 consume EntityHypothesis and nothing else produces it.
    #
    # The Audit-0034 numbers below are retained because they are real, and they are
    # what the L4 route selection above must eventually be re-decided against. They
    # describe the cost of MERGING E1/E2 into the lattice, not a switch.
    #
    #   Arm 1  E3 neural only                       exact F1 0.7103
    #   Arm 3  unified L3 lattice, before L4        exact F1 0.6963  (-0.0139)
    #   Arm 4  unified lattice, after L4 v1         exact F1 0.7039  (-0.0063)
    #
    # Arm 4 still sits BELOW the neural-only baseline: on this narrative corpus the
    # deterministic experts contribute only false positives (Arm 2 exact F1 0.0000,
    # 79 proposals, 0 exact matches). That is why `deterministic` and `specialist`
    # remain separate modes rather than one merged profile.
    #
    # Reproduce these arms with evaluation/l3_l4_ablation_v2.py. Thresholds must be
    # searched on the VALIDATION split, never on internal_test.
    l4_measurement_note:
      decided_in: docs/audits/0034-l3-span-lattice-l4-resolver-and-ablation.md
      reproduced_by: src/mednorm_vi/evaluation/l3_l4_ablation_v2.py
      runtime_effect: none
  full:
    neural: true
    requires_checkpoints: true
    feature_flags:
      enable_e1_medication_grammar: true
      enable_e2_laboratory_parser: true
      enable_e3_vihealthbert: true
      enable_e5_xlmr_mrc: false
      enable_e6_gliner: false
      enable_e7_qwen_proposer: false
      enable_l4_deterministic_v1: true
      enable_l4_learned_v2: false
