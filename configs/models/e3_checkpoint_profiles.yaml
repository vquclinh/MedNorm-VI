version: e3-checkpoint-profiles-v1

# Named, hash-pinned E3 span/type checkpoints (Audit 0062).
#
# Before this file the active E3 artifact was a bare default constant in
# `mention_factory/experts/e3_vihealthbert.py`, and rolling back meant editing source.
# A rollback that requires a code change is not a rollback you will make under pressure.
# Every profile here carries its own digest, so selecting one is a config edit and
# selecting a substituted file is impossible.
#
# CONTRACT: `active` names exactly one profile, and
# `configs/pipeline/full_v1.yaml -> expert_settings.e3_checkpoint_path` /
# `e3_expected_checkpoint_sha256` MUST equal that profile's `path` / `sha256`. The two
# files are checked against each other by
# `tests/unit/test_e3_checkpoint_profiles_0062.py`, so they cannot drift apart.

