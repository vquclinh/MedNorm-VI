# ZS0 exact parameter ledger (Audit 0048)
# =============================================================================
# The 9B cap governs what is RESIDENT AT INFERENCE, not what is on disk.
#
# Counts marked `count_verified: false` fail the gate CLOSED. They are filled in
# by Stage 1 of the notebook, which counts each checkpoint programmatically on
# Colab; nothing here is a published estimate promoted to fact.
version: zs0-parameter-ledger-v1
max_active_parameters: 9000000000

components:
  - component_id: e1_medication_grammar
    model_id: deterministic
    parameter_count: 0
    loaded_during_inference: true
    concurrent_with_other_models: false
    count_method: counted_from_config
    count_verified: true

  - component_id: e2_laboratory_parser
    model_id: deterministic
    parameter_count: 0
    loaded_during_inference: true
    concurrent_with_other_models: false
    count_method: counted_from_config
    count_verified: true

  - component_id: e6_gliner
    model_id: urchade/gliner_medium-v2.1
    revision: ""              # pinned by Stage 1 before any inference
    parameter_count: null     # counted on Colab; null fails the gate closed
    loaded_during_inference: true
    concurrent_with_other_models: true
    count_method: unknown
    count_verified: false

  - component_id: e7_qwen_cascade
    model_id: Qwen/Qwen3-1.7B
    revision: ""
    parameter_count: null
    adapter_parameters: 0
    loaded_during_inference: true
    concurrent_with_other_models: true
    # ONE Qwen instance serves all three duties: hard mention proposal,
    # assertion adjudication and candidate selection. Sharing is why the
    # smallest supported model is preferred over adding Qwen3-4B.
    shared_instance_key: qwen_cascade_base
    count_method: unknown
    count_verified: false

  - component_id: dense_embedder
    model_id: BAAI/bge-m3
    revision: ""
    parameter_count: null
    loaded_during_inference: true
    concurrent_with_other_models: false
    count_method: unknown
    count_verified: false

  - component_id: reranker
    model_id: Qwen/Qwen3-Reranker-0.6B
    revision: ""
    parameter_count: null
    # Optional. Enabled only when Stage 2 shows it is reproducible AND useful.
    loaded_during_inference: false
    concurrent_with_other_models: false
    count_method: unknown
    count_verified: false

# E4 is absent by design: a retired expert loads no weights and contributes no
# parameters. E3 and E5 are absent because ZS0 uses no fitted weights and no
# randomly initialized head.
excluded:
  - component_id: e3_vihealthbert_span_type
    reason: fine-tuned in this project; ZS0 is pretrained-only
  - component_id: e4_phobert_w2ner
    reason: RETIRED_FROM_ACTIVE_STACK (Audit 0048)
  - component_id: e5_xlmr_mrc_ner
    reason: randomly initialized task head is not zero-shot
