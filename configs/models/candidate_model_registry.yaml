    total_parameters: 134998272
    trainable_parameters: 134998272
    adapter_parameters: 9228
    loaded_at_inference: false
    shares_weights_with: vihealthbert_base
    parameter_count_method: counted_from_config
    parameter_count_verified: true
    notes: >-
      Four 3-label task heads (cue, scope, relation, final assertion logits) over
      the shared 768-hidden ViHealthBERT backbone. The head count is reproduced
      by build_s2_assertion_head(). The governed corpus currently has ZERO
      assertion supervision, so this component is code-ready and data-blocked;
      see Audit 0042.

