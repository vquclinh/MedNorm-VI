# MedNorm-VI — candidate model registry (Audit 0042)
# ==============================================================================
# The CANDIDATE inventory: every model trained or evaluated during research.
#
# The spec §17 9B limit is NOT applied to this file. Training several
# alternatives is permitted even when their sum exceeds 9B, provided they are not
# all deployed together. The limit is enforced only against a selected
# DEPLOYMENT manifest (see deployment_budget_template.yaml).
#
# The complete architecture is preserved. A component that is not implemented yet
# is recorded as PLANNED with NO invented model id and NO guessed parameter
# count — a PLANNED entry carrying a count is rejected by the loader.
#
# Counting policy:
#   * `parameter_count_verified: true` requires a real programmatic count
#     (counted_from_config / counted_from_checkpoint). Spec §17 says counts
#     "must be verified by an automated parameter-count script before
#     submission".
#   * `published_estimate` values are recorded for planning ONLY and are NOT
#     verified. A deployment that selects an unverified component fails closed.
#   * The spec §17 table (~8.852B total) is an approximate planning figure and is
#     deliberately NOT hardcoded as fact anywhere in this repository.
version: candidate-model-registry-v1

components:
  # --------------------------------------------------------------------------
  # E3 / S1 — the only trained mention expert today (Audits 0031-0034)
  # --------------------------------------------------------------------------
  - component_id: e3_vihealthbert_span_type
    architecture_layer: L3
    training_stage: S1
    status: TRAINED
    model_id: demdecuong/vihealthbert-base-word
    pinned_revision: f89e80b461e86f9cfc1c84019bd819830c24b6c5
    checkpoint_role: mention_span_type
    # VERIFIED: AutoModel.from_config() instantiated from the locally cached
    # config and counted programmatically on 2026-07-27.
    total_parameters: 134998272
    trainable_parameters: 134998272
    adapter_parameters: 0
    loaded_at_inference: true
    shares_weights_with: vihealthbert_base
    parameter_count_method: counted_from_config
    parameter_count_verified: true
    notes: >-
      Exact character-offset F1 0.7103 on governed internal_test (Audit 0033).
      Spec §17 lists "approximately 0.135B"; the verified count is 134,998,272.

  # --------------------------------------------------------------------------
