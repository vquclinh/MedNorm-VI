    total_parameters: null
    trainable_parameters: null
    adapter_parameters: 0
    loaded_at_inference: false
    shares_weights_with: ""
    parameter_count_method: published_estimate
    parameter_count_verified: false
    notes: >-
      Full training was running externally on Colab while this registry was
      written. Its artifact must be validated before any deployment selection.

  # --------------------------------------------------------------------------
