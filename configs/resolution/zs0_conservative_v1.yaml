# ZS0 conservative zero-shot resolver thresholds (Audit 0048).
#
# One tracked file, fixed once. No threshold search is performed: with no
# trained resolver and no assertion supervision, a search over the validation
# split would be fitting the metric rather than the problem.
version: zs0-conservative-resolver-v1
min_single_expert_score: 0.50
min_agreement_score: 0.30
max_wrong_type_risk: 0.60
near_complete_overlap_iou: 0.80
threshold_search_performed: false
routes:
  structured: prefer_complete_medication_and_laboratory_grammar_boundaries
  narrative: prefer_contextual_evidence
