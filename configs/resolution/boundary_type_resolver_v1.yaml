# MedNorm-VI — L4 Boundary & Type Resolver v1 (spec §7)
# ==============================================================================
# ONE tracked config for every threshold and weight the resolver uses. Its
# SHA-256 is recorded in every report, so a number can never be produced by an
# untracked setting.
#
# These weights are DESIGNED, not learned. Spec §7.1 describes a boundary-offset
# head trained with an exact-span/IoU/WER-surrogate loss; that head does not
# exist and was not trained in this milestone. Everything below is a
# deterministic, auditable feature combination whose effect is measured by the
# exact evaluator rather than assumed.
version: 1
config_version: boundary-type-resolver-v1

# ------------------------------------------------------------------------------
# Type scoring (spec §7.2). U(node, type) is a weighted sum of the evidence
# families the architecture names. Everything is bounded to [0, 1] per family
# before weighting, so no single family can dominate by scale alone.
# ------------------------------------------------------------------------------
type_weights:
  neural_span_type: 1.00        # E3 per-type score
  grammar_completeness: 0.60    # E1 medication grammar structure
  laboratory_evidence: 0.60     # E2 value/unit/flag/range structure
  section_prior: 0.25           # spec §4.2 — evidence, never an absolute rule
  route_prior: 0.20             # spec §5 — processing case, not an entity type
  expert_agreement: 0.30        # two families proposing the same span+type
  ontology_evidence: 0.25       # only the ontology allowed for that type
  delimiter_shape: 0.10         # colon+numeric ⇒ TEST_NAME/TEST_RESULT

# Disagreement between a deterministic expert and the neural expert on the SAME
# coordinates. Subtracted from the loser's utility; it never silently deletes a
# node.
expert_disagreement_penalty: 0.15

# ------------------------------------------------------------------------------
# Section priors (spec §4.2). A section is EVIDENCE, not a rule: a prior can be
# outscored by local evidence and never forces a type on its own.
# ------------------------------------------------------------------------------
section_priors:
  laboratory:                {TEST_NAME: 1.0, TEST_RESULT: 1.0}
  diagnosis:                 {DIAGNOSIS: 1.0}
  current_examination:       {SYMPTOM: 0.8}
  symptoms:                  {SYMPTOM: 1.0}
  pre_admission_medications: {MEDICATION: 1.0}
  home_medications:          {MEDICATION: 1.0}
  current_medications:       {MEDICATION: 1.0}
  treatment:                 {MEDICATION: 0.5}

# Route priors (spec §5). C1 medication list, C2 laboratory rows, C3 narrative.
route_priors:
  C1: {MEDICATION: 1.0}
  C2: {TEST_NAME: 0.9, TEST_RESULT: 0.9}
  C3: {SYMPTOM: 0.3, DIAGNOSIS: 0.3}

# ------------------------------------------------------------------------------
# Abstention (spec §7.2). A wrong type is double-penalised, so a hypothesis with
# a weak winner or a near-tie between two types is DROPPED rather than guessed.
# ------------------------------------------------------------------------------
abstention:
  # Minimum utility the winning type must reach to be emitted at all.
  min_type_utility: 0.30
  # Minimum gap between the best and second-best type. Below it the node is a
  # wrong-type risk and is abstained on.
  min_type_margin: 0.05
  # A type-vs-ontology conflict (spec §7.2) always abstains, regardless of margin.
  abstain_on_ontology_conflict: true

  # Abstain when the ONLY support for the winning type is a deterministic expert
  # that flagged its own parse (`unknown_test_name`, `unknown_medication_name`,
  # `incomplete_parse_no_strength`) and no other expert agrees. This is an
  # evidence-quality rule, not a threshold fitted to a split: the expert itself
  # reported that its evidence was weak, and spec §7.2 says a hypothesis with a
  # weak or conflicting basis is dropped rather than guessed.
  abstain_on_flagged_deterministic_evidence: true

# ------------------------------------------------------------------------------
# Boundary shaping (spec §7.1). Two bounded operations, both of which must keep
# original_text[start:end] == text.
#
#   trim   — remove leading/trailing characters that the organizer's convention
#            does not include: whitespace, list numbers, bullets, separators.
#   expand — adopt a COMPETING LATTICE BOUNDARY only. The resolver never invents
#            an offset no expert proposed.
# ------------------------------------------------------------------------------
boundary:
  enable_trim: true
  enable_expand: true
  # Hard cap on how many characters trimming may remove from each side.
  max_trim_chars: 4
  # Characters trimmable at the left/right edge of a span.
  trim_characters: " \t\n\r.,;:!?()[]{}\"'`«»…-–—/\\|*+•"
  # Leading list markers ("1.", "2)", "-", "•") are structure, not entity text.
  trim_leading_list_markers: true
  # Expansion is only allowed onto a competing boundary sharing this edge and
  # supported by grammar completeness at least this high.
  expand_requires_grammar_completeness: 0.60
  # Expansion may never add more than this many characters.
  max_expand_chars: 40

  # Boundary ALTERNATIVES of one logical mention (E1's name_only→full ladder,
  # E2's value_only/value+unit pair) share a boundary group id. Exactly one
  # alternative per group may survive — emitting both would put two overlapping
  # spans for a single mention into the output. The preferred kind per group is
  # below; it mirrors configs/resolution/resolver_v1.yaml so the deterministic
  # foundation and v1 cannot silently disagree.
  #
  # medication: the one confirmed golden example favours the FULL span.
  # test_result: UNRESOLVED organizer convention — conservative value_only.
  group_preference:
    medication: full
    test_result: value_only

# ------------------------------------------------------------------------------
# Overlap structure (spec §7.3). Never deduplicate by text alone; merge only when
# position and semantic identity are the same; penalise near-complete overlap
# between two spans of the same type.
# ------------------------------------------------------------------------------
overlap:
  # Jaccard over character intervals at or above which two same-type spans are
  # "near-complete" competitors and only the higher-utility one survives.
  near_complete_iou: 0.60
  # Penalty applied to the loser before the survival decision (reported, so the
  # competition is auditable rather than silent).
  competition_penalty: 0.20
  # Cross-type overlaps are kept: TEST_NAME and TEST_RESULT legitimately sit
  # beside each other, and nesting is a real annotation possibility.
  suppress_cross_type: false
  # A hypothesis in a strong has_result pair is never suppressed by its partner.
  protect_has_result_pairs: true
  # Minimum relation score for a has_result edge to count as "strong" (spec §7.3).
  strong_has_result_score: 0.50

# ------------------------------------------------------------------------------
# Ontology consistency (spec §7.3): "Forbid ICD candidates on MEDICATION and
# RxNorm candidates on DIAGNOSIS." Applied here as an evidence rule: ICD evidence
# may never reinforce MEDICATION and RxNorm evidence may never reinforce
# DIAGNOSIS. The pairing below is the ONLY allowed direction.
# ------------------------------------------------------------------------------
ontology:
  allowed_evidence:
    DIAGNOSIS: ICD10
    MEDICATION: RXNORM
  forbidden_evidence:
    MEDICATION: ICD10
    DIAGNOSIS: RXNORM
