version: learned-l4-boundary-type-resolver-v2
status: IMPLEMENTED_UNTRAINED
enabled: false
checkpoint:
  path: ""
  sha256: UNAVAILABLE_UNTRAINED
training_protocol:
  train_split: governed_train_only
  model_selection_split: governed_validation_only
  internal_test_allowed_during_development: false
  grouped_split_key: source_or_document_group
targets:
  boundary_actions: [KEEP, SELECT_EXISTING, OFFSET, DROP]
  max_boundary_delta: 12
  exact_span_loss: true
  token_iou_auxiliary: true
  type_loss: true
  wrong_type_cost: true
  diagnosis_symptom_explicit_features: true
  wer_boundary_surrogate: optional
thresholds:
  keep_threshold: 0.5
  abstain_margin: 0.05
  wrong_type_risk_threshold: 0.35
runtime:
  no_auto_download: true
  read_only_checkpoint: true
  optimizer_forbidden_in_inference: true
  backward_forbidden_in_inference: true
