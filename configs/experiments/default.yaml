# MedNorm-VI — experiment tracker config (default)
# ------------------------------------------------------------------------------
# Local, diff-friendly experiment registry. The tracker never scrapes the
# leaderboard or calls external services; leaderboard scores are entered manually
# and never replace local error analysis.
registry_location: experiments/registry
experiment_id_format: "EXP-{:04d}"
hash_algorithm: sha256

# Metadata fields tracked per experiment (documentation; see experiments/models.py).
tracked_metadata:
  - experiment_id
  - title
  - description
  - creation_time_utc
  - git_commit
  - git_dirty
  - config_path
  - config_hash
  - model_profile
  - model_versions
  - adapter_versions
  - data_versions
  - kb_versions
  - code_version
  - seed
  - thresholds
  - decoding_settings
  - output_dir
  - output_zip_hash
  - prediction_file_hashes
  - change_summary
  - hypothesis
  - observed_result
  - conclusion
  - parent_experiment_id
  - tags
  - notes

leaderboard_fields:
  - score
  - submission_id
  - timestamp_utc
  - component_scores

# Local score provenance is kept strictly separate from leaderboard score.
local_score_kinds:
  - gold        # team-owned adjudicated ground truth (model selection)
  - silver      # weak/pseudo labels (lower trust)
  - synthetic   # controlled generated data (unit/stress)
separate_local_from_leaderboard: true
