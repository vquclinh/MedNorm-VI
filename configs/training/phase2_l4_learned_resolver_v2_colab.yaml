version: phase2-learned-l4-resolver-v2-colab-v1
stage_id: phase2-learned-l4-resolver-v2
expert_id: learned-l4-boundary-type-resolver-v2
status: READY_FOR_COLAB_SMOKE
enabled_by_default: false
environment:
  intended_runtime: Colab CPU or GPU
  repository_dir: /content/MedNorm-VI
  drive_root: /content/drive/MyDrive/MedNorm-VI
authorization:
  full_training: I_AUTHORIZE_L4_V2_FULL_TRAINING
artifacts:
  smoke_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/l4_learned_resolver_v2_smoke_v1
  full_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/l4_learned_resolver_v2_full_v1
  required_files:
    - checkpoints/best.pt
    - checkpoints/latest.pt
    - logs/training_history.jsonl
    - resolved_config.json
    - validation_metrics.json
    - training_manifest.json
input_proposals:
  train: /content/drive/MyDrive/MedNorm-VI/artifacts/phase2_frozen_proposals_train_v1/proposals.jsonl
  validation: /content/drive/MyDrive/MedNorm-VI/artifacts/phase2_frozen_proposals_validation_v1/proposals.jsonl
training:
  smoke_max_epochs: 1
  full_max_epochs: 50
  full_initialization_source: learned_l4_random_seeded_architecture
  reject_smoke_checkpoint_as_full_initializer: true
  validation_after_every_epoch: true
  best_criterion: max_validation_exact_f1_governed_validation_only
loss_weights:
  boundary_action: 1.0
  type_action: 1.0
  wrong_type: 0.5
  iou_auxiliary: 0.2
  wer_boundary: 0.1
  class_imbalance: 1.0
runtime:
  cpu_inference_supported: true
  free_text_generation_allowed: false
  internal_test_allowed: false
validator:
  cli: env PYTHONPATH=src python -m mednorm_vi.training.phase2.cli validate-artifact --kind l4 --artifact-dir ARTIFACT_DIR --mode full
