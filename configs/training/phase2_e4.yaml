# MedNorm-VI — E4 PhoBERT W2NER, current configuration (Audit 0045)
# =============================================================================
# The single E4 configuration. The implementation that produced the collapsed
# run audited in 0043/0044 was removed, not patched; this file replaces both
# `phase2_e4_phobert_w2ner_colab.yaml` and `phase2_e4_tiny_overfit_diagnostic.yaml`.
#
# Four measured failures are corrected here. Each is a config field, not prose:
#
#   1  per-example loss normalization   -> loss.reduction = batch_global_valid_cell_mean
#   2  no imbalance compensation        -> three candidate recipes, ablated in Stage 2
#   3  unshuffled source-grouped order  -> data_order + positive-aware sampling
#   4  constant learning rate           -> differential LRs + warmup/linear decay
version: phase2-e4-v1
stage_id: phase2-e4-clean-v1
expert_id: E4_phobert_w2ner
status: IMPLEMENTED_NOT_AUTHORIZED
enabled_by_default: false

# ---------------------------------------------------------------------------
# Staged authorization. Every flag ships False; every stage needs its string.
# ---------------------------------------------------------------------------
authorization:
  stage2_tiny_recipe_ablation: I_AUTHORIZE_E4_TINY_RECIPE_ABLATION
  stage3_subset_smoke: I_AUTHORIZE_E4_SUBSET_SMOKE
  stage4_full_training: I_AUTHORIZE_E4_FULL_TRAINING
  committed_run_flags: false
  committed_confirmation_values: ""
  # Stage 4 verifies the Stage-2 and Stage-3 gate artifacts and re-checks their
  # config/code/corpus hashes. Flipping a flag cannot bypass them.
  fail_closed: true

environment:
  intended_runtime: Colab T4 (any CUDA GPU is acceptable; CPU is refused)
  repository_dir: /content/MedNorm-VI
  drive_root: /content/drive/MyDrive/MedNorm-VI
  model_cache_dir: /content/drive/MyDrive/MedNorm-VI/model_cache/huggingface
  vncorenlp_dir: /content/drive/MyDrive/MedNorm-VI/model_cache/vncorenlp
  runtime_root: /content/mednorm_vi_runtime
  local_training_forbidden: true

dependencies:
  # The prior tiny diagnostic failed in Colab because py_vncorenlp was absent.
  # This is an executable install in the notebook's first cell, before any
  # import, not a documented prerequisite.
  py_vncorenlp: 0.1.4
  install_command: "%pip install -q py_vncorenlp==0.1.4"
  preflight_verifies:
    - py_vncorenlp imports
    - py_vncorenlp version and package location printed
    - VnCoreNLP model download or cache resolution succeeds
    - torch imports
    - transformers imports
    - CUDA is available
    - GPU name printed
    - runtime is a T4-compatible CUDA runtime
    - pinned PhoBERT revision printed
    - internal_test prohibited

artifacts:
  # One current artifact directory. Recipe candidates are pruned after selection.
  current_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/e4_current
  gate_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/e4_current/gates
  tiny_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/e4_current/stage2_tiny
  subset_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/e4_current/stage3_subset
  retain_non_selected_recipe_checkpoints: false
  retain_non_best_subset_checkpoints: false
  files:
    - checkpoints/best.pt
    - checkpoints/latest.pt
    - gates/stage2_tiny_ablation.json
    - gates/stage3_subset_smoke.json
    - logs/training_history.jsonl
    - resolved_config.json
    - validation_metrics.json
    - training_manifest.json

model:
  id: vinai/phobert-large
  revision: 1c7880f20db59c0054c6de5afd71b012369f6ee4
  tokenizer_revision: 1c7880f20db59c0054c6de5afd71b012369f6ee4
  tokenizer_class: PhobertTokenizer
  tokenizer_is_fast: false
  # The pinned revision publishes pytorch_model.bin and no safetensors; the
  # Audit-0044 probe re-confirmed this against the hub file listing.
  pretrained_weight_format: pytorch_model.bin
  use_safetensors: false
  freeze_base_model: false
  quantization: none
  initialization: pinned_pretrained_base_fresh_head
  # A v2 checkpoint restores perfectly and carries the converged all-background
  # solution, which is exactly why the schema bump refuses it mechanically.
  checkpoint_schema_version: phase2-e4-checkpoint-v3
  rejected_checkpoint_schema_versions:
    - phase2-e4-checkpoint-v1
    - phase2-e4-checkpoint-v2
  resume_from_superseded_checkpoint: false

data:
  train_split_sha256: 892dc22d7e051e05f9c96d90f42dfde7f38083a74bba6fe65b5c1d9dd05e2a4a
  validation_split_sha256: ed7cdd2d49799cef0a868b6c75a3df4ca1e93ed03223337a7d31afe40f68f103
  resolution_policy: resolve_by_authoritative_sha256_not_filename
  internal_test_allowed: false
  input_contract_version: e4-atomic-grid-word-v1
  grid_word_surface: atomic-original-word-v1
  atomic_projection_version: atomic-projection-v1
  max_words: 256

  # -------------------------------------------------------------------------
  # Supervision scope
  # -------------------------------------------------------------------------
  # The output schema keeps all five organizer types and all seven grid labels.
  # But the governed E4 corpus contains ZERO TEST_NAME and ZERO TEST_RESULT
  # mentions in train and validation alike, so two classifier outputs have no
  # training signal. That is recorded, never fabricated: no synthetic laboratory
  # mention is generated and no stage is failed for not predicting them.
  supervised_types: [DIAGNOSIS, MEDICATION, SYMPTOM]
  unsupervised_types: [TEST_NAME, TEST_RESULT]
  unsupervised_type_policy: >-
    left to E1/E2 extraction and the L4 resolver; E4 proposes only what it is
    actually supervised for.

  # -------------------------------------------------------------------------
  # Data order (measured failure 3)
  # -------------------------------------------------------------------------
  # File order put 10,027 consecutive zero-entity phoner_covid19 examples at the
  # start of every epoch — about 1,253 optimizer steps of pure "predict NONE"
  # before a single positive cell.
  order:
    deterministic_shuffle_every_epoch: true
    source_interleaving: stratified_fractional_position
    seeded_by: [seed, epoch, row_index]
    uses_global_rng: false
    zero_entity_examples_removed: false
    max_zero_entity_streak: 4
    max_zero_entity_fraction_guard: 0.85
    measured_realized_composition_written_to_manifest: true

# ---------------------------------------------------------------------------
# The three candidate recipes (Stage 2 ablates all three)
# ---------------------------------------------------------------------------
recipes:
  shared:
    loss_reduction: batch_global_valid_cell_mean
    per_example_mean: false
    optimizer: AdamW
    backbone_learning_rate: 5.0e-6
    head_learning_rate: 1.0e-3
    weight_decay: 0.01
    scheduler: linear_warmup_linear_decay
    warmup_ratio: 0.10
    max_grad_norm: 5.0
    micro_batch_size: 1
    gradient_accumulation_steps: 8
    precision: fp16
    grad_scaler: true
    validation_every_epoch: true
    early_stopping_patience: 3
    best_criterion: max_validation_exact_f1_governed_validation_only

  reference_ce:
    objective: cross_entropy
    data_order: shuffled_source_interleaved

  reference_ce_resampled:
    objective: cross_entropy
    data_order: positive_aware_resampled

  balanced_focal:
    objective: focal
    data_order: shuffled_source_interleaved
    gamma: 2.0
    alpha: 0.25
    # alpha/(1-alpha) = 0.333 positive:background. The raw 577:1 inverse
    # frequency weight is explicitly refused by the loader.
    max_effective_class_weight_ratio: 100.0
    log_positive_background_total_loss_separately: true

# ---------------------------------------------------------------------------
# Stages
# ---------------------------------------------------------------------------
stages:
  stage2_tiny_recipe_ablation:
    examples: 12
    gold_mentions: 22
    identical_across_recipes: [examples, revision, seed, epoch_bound, evaluation,
                               decoder, precision]
    pass_criteria:
      exact_train_f1_at_least: 0.95
      predicted_mentions_greater_than: 0
      positive_cell_accuracy_greater_than: 0
      every_present_supervised_type_predicted: true
      save_reload_reproduces_metric: true
    grid_cell_accuracy_is_a_pass_criterion: false
    selection_order: [exact_f1, exact_recall, fewest_false_positives,
                      lower_runtime, lower_peak_vram, simpler_recipe]
    stop_if_no_recipe_passes: true

  stage3_subset_smoke:
    recipe: selected_by_stage2
    subset_contains: [DIAGNOSIS, MEDICATION, SYMPTOM, positive_examples,
                      zero_entity_examples, every_governed_training_source]
    disjoint_validation_subset: true
    record_ids_and_hashes: true
    pass_criteria:
      validation_predicted_mentions_greater_than: 0
      validation_recall_greater_than: 0
      nnw_predictions_greater_than: 0
      thw_predictions_greater_than: 0
      every_present_supervised_type_predicted: true
      max_gold_positive_background_rate: 0.98
      collapse_guard_did_not_fire: true
      save_reload_reproduces_metrics: true
      artifact_validator_ok: true
    stop_if_gate_fails: true

  stage4_full_training:
    requires_passing_gates: [stage2_tiny_ablation, stage3_subset_smoke]
    requires_matching_hashes: [config_sha256, code_sha256, corpus_sha256]
    epochs: 12
    initialization: pinned_pretrained_base_fresh_head
    resume_policy: same_run_interruption_only
    checkpoint_order: [local_save, local_sha256, local_reload_check,
                       drive_health, temp_copy, atomic_replace, verify_equal]

collapse_guard:
  applies_after_warmup_epochs: 1
  patience: 2
  # All four symptoms must hold at once: any one alone is survivable early.
  conditions_all_required:
    - predicted_mentions == 0
    - thw_predictions == 0
    - recall == 0
    - gold_positive_background_rate >= 0.999
  on_fire:
    stop_run: true
    status: COLLAPSED_NOT_TRAINED
    may_be_marked_fully_trained: false
  # Replayed against the audited history it fires at epoch 5 rather than 12,
  # saving 7 epochs and 236,782 backward passes.

permitted:
  local_training: false
  internal_test_access: false
  organizer_inference: false
  output_zip_creation: false
  tracked_checkpoints: false
