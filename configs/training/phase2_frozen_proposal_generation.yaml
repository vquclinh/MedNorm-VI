version: phase2-frozen-proposal-generation-v1
stage_id: phase2-frozen-l3-proposals-v1
status: READY_FOR_COLAB_SMOKE
splits: [train, validation]
internal_test_allowed: false
outputs:
  train_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/phase2_frozen_proposals_train_v1
  validation_dir: /content/drive/MyDrive/MedNorm-VI/artifacts/phase2_frozen_proposals_validation_v1
  files:
    - proposals.jsonl
    - proposal_manifest.json
expert_inputs:
  e1_medication_grammar:
    status: AVAILABLE_DETERMINISTIC
  e2_laboratory_parser:
    status: AVAILABLE_DETERMINISTIC
  e3_vihealthbert:
    checkpoint: checkpoint/s1_mention_full_training_v1/best.pt
    checkpoint_sha256: a64cc173a284e42ff4bc21b6e0914314d6ff2c6c13efd7fc04d7be0f9be1017c
    model_revision: f89e80b461e86f9cfc1c84019bd819830c24b6c5
  e4_phobert_w2ner:
    status: optional_validated_checkpoint_required
  e5_xlmr_mrc:
    status: optional_validated_checkpoint_required
leakage_controls:
  train_predictions: frozen_or_out_of_fold_only
  validation_predictions: frozen_checkpoint_only
  source_group_key: source_or_document_group
  reject_internal_test: true
validator:
  cli: env PYTHONPATH=src python -m mednorm_vi.training.phase2.cli validate-proposals --manifest PROPOSAL_MANIFEST --proposals-jsonl PROPOSALS_JSONL
