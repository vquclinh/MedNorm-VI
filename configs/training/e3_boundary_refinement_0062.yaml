version: 1
stage_id: S1
mode: FULL_TRAINING

# E3 boundary-aware refinement (Audit 0062, Milestone 4C).
#
# This config does NOT retrain E3 from the pretrained base. It continues the
# validated `best.pt` at a lower learning rate, which is why `initialize_from`
# is `refinement_checkpoint` and why `s1_full_training.FullTrainingConfig` is not
# reused verbatim: that contract deliberately REFUSES any initializer other than
# `pretrained_base`, because for a from-scratch S1 run a checkpoint initializer
# would silently launder the smoke artifact into a full run. Refinement is the
# case that rule was not written for, so it gets its own explicit contract rather
# than a loosened one.
#
# EVIDENCE (Audit 0062 §4). The reproduced baseline is exact:
#   micro span+type P=0.6270 R=0.5344 F1=0.5770 on 1,045 governed validation
#   examples / 1,991 gold entities.
# The label-projection oracle - the training labels decoded by the inference
# rule, i.e. a model with ZERO classification error - reaches F1 0.9713. The
# architecture is therefore not the ceiling; 39.4 F1 points are model capability.
# The direction of the residual error is unambiguous:
#   269 boundary errors too NARROW vs 124 too WIDE (2.2:1),
#   534 of 534 missed entities were never proposed by E3 at all,
#   long spans collapse (8+ words: 7.1% exact; 4-7 words: 49.7%).
# The model systematically UNDER-fires, and the loss explains why: focal
# `alpha_t = alpha*y + (1-alpha)*(1-y)` with alpha=0.25 weights the rare positive
# class (8.26% of supervised tokens) at ONE THIRD the weight of the negative
# class. R2 changes that one scalar and nothing else.

model:
  registry_model_id: vihealthbert_span_type
  hf_model_id: demdecuong/vihealthbert-base-word
  pinned_revision: f89e80b461e86f9cfc1c84019bd819830c24b6c5
  initialize_from: refinement_checkpoint
  source_checkpoint: checkpoint/s1_mention_full_training_v1/best.pt
  source_checkpoint_sha256: a64cc173a284e42ff4bc21b6e0914314d6ff2c6c13efd7fc04d7be0f9be1017c

data:
  corpus_dir_relative: data/derived/training_corpora/mednorm_vi_training_v1
  max_sequence_length: 256
  # Unchanged from the original run: phoner_covid19 declares boundary=false and
  # entity_type=false, so its label_mask is entirely zero and it produces no
  # gradient. The governed corpus files are never modified.
  filter_unsupervised_examples: true
  expected_train_sha256: 892dc22d7e051e05f9c96d90f42dfde7f38083a74bba6fe65b5c1d9dd05e2a4a
  expected_train_examples: 33826
  expected_validation_examples: 1045

optimization:
  # Refinement, not training: 2 epochs with early stopping, not 4.
  num_epochs: 2
  per_device_batch_size: 8
  gradient_accumulation_steps: 4      # effective batch 32, identical to the original
  # The original run used 3e-5 / 1e-4. Continued fine-tuning from a converged
  # checkpoint uses strictly lower rates so the run refines rather than restarts.
  learning_rate: 0.00001
  head_learning_rate: 0.00003
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  mixed_precision: auto

loss:
  type: focal
  focal_gamma: 2.0
  # R1 keeps 0.25; R2 overrides this to 0.75 on the command line. Nothing else
  # differs between the two recipes, so the comparison attributes cleanly.
  focal_alpha: 0.25
  decision_threshold: 0.5

evaluation:
  # Spec §18.1 and brief §7: selection uses the EXACT character-span + type
  # evaluator, never token-level accuracy. This is a deliberate change from the
  # original run, which selected on `validation_span_micro_f1` - a token-run
  # proxy that can improve while exact character spans get worse.
  best_metric_key: exact_span_type_micro_f1
  best_metric_mode: max
  evaluate_at_epoch_end: true
  early_stopping_patience: 1

seed: 20260731
confirmation_phrase: "RUN E3 BOUNDARY REFINEMENT"
