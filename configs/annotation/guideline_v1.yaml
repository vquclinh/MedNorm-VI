# MedNorm-VI — annotation guideline config (v1)
# ------------------------------------------------------------------------------
# Machine-readable companion to docs/annotation/ANNOTATION_GUIDELINES.md. Some
# rules are INTERNAL PROVISIONAL until the organizer publishes enough examples;
# those are marked provisional: true.
guideline_version: v1

# Organizer-facing labels (confirmed).
allowed_labels:
  - THUỐC
  - CHẨN_ĐOÁN
  - TRIỆU_CHỨNG
  - TÊN_XÉT_NGHIỆM
  - KẾT_QUẢ_XÉT_NGHIỆM

allowed_assertions:
  - isNegated
  - isHistorical
  - isFamily

# Per-type output fields (confirmed).
per_type_fields:
  THUỐC:              [text, type, candidates, assertions, position]
  CHẨN_ĐOÁN:          [text, type, candidates, assertions, position]
  TRIỆU_CHỨNG:        [text, type, assertions, position]
  TÊN_XÉT_NGHIỆM:     [text, type, position]
  KẾT_QUẢ_XÉT_NGHIỆM: [text, type, position]

# Offset convention (confirmed).
offset_convention:
  end_exclusive: true            # original_text[start:end] == text
  code_point_indexing: true

# Review-status policy.
review_statuses:
  - DRAFT
  - SINGLE_REVIEWED
  - DOUBLE_REVIEWED
  - ADJUDICATED
  - REJECTED
accepted_gold_statuses:
  - ADJUDICATED                  # only adjudicated (or explicitly approved GOLD) is final gold

# Duplicate / overlap policy.
duplicate_policy:
  same_text_different_position: distinct   # never collapse repeated mentions
  exact_duplicate_same_position: reject
overlap_policy:
  nested_spans: provisional      # allow only if organizer data supports them
  provisional: true

# Cue-lexicon version references (see docs/annotation/ANNOTATION_GUIDELINES.md §cues).
cue_lexicons:
  historical_version: 0
  family_version: 0
  negation_version: 0
  note: >-
    Cue lists are versioned EVIDENCE sources, not absolute rules. Local discourse
    may override section priors. Grow with recall + false-positive regression
    tests; do not build the final exhaustive lexicon in Phase 0.5.

# Provisional annotation rules (organizer convention not yet fully published).
provisional_rules:
  medication_span_includes: provisional   # strength/route/frequency/PRN/release
  diagnosis_vs_symptom: provisional
  test_name_vs_result: provisional
